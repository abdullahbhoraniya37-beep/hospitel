<section id="doctors" class="section alt"><div class="container"><div class="head"><div><div class="kicker">Medical Team</div><h2>Our Doctors</h2></div><p>View the hospital's primary, supportive, visiting and consultant doctors. Profiles are controlled by the administrator.</p></div><div class="filters"><input id="doctorSearch" placeholder="Search doctor, degree or specialty" oninput="renderDoctorGrid()"><select id="doctorFilter" onchange="renderDoctorGrid()"><option value="">All Doctor Types</option><option>PRIMARY DOCTOR</option><option>SUPPORTIVE DOCTOR</option><option>VISITING DOCTOR</option><option>CONSULTANT</option><option>SPECIALIST</option></select></div><div id="doctorGrid"></div></div></section>
<section id="diseases" class="section"><div class="container"><div class="head"><div><div class="kicker">Conditions</div><h2>Diseases & Conditions</h2></div><p>Condition information is for general awareness. Consult a qualified healthcare professional for diagnosis and personalized treatment.</p></div><div class="grid3">${data.diseases.filter(x=>x.active).sort((a,b)=>(a.order||0)-(b.order||0)).map((d,i)=>`<article class="card reveal">${d.photo?`<img src="${esc(d.photo)}" alt="${esc(d.name)}">`:`<div class="icon">${['🩺','💙','❤️','🫁','🧠','🦴','🧬','🌿'][i%8]}</div>`}<h3>${esc(d.name)}</h3><p>${esc(d.description)}</p><a class="btn soft small" href="#appointment">Book Consultation →</a></article>`).join('')||'<div class="card"><h3>No conditions added yet.</h3></div>'}</div></div></section>
<section id="treatments" class="section alt"><div class="container"><div class="head"><div><div class="kicker">Care</div><h2>Treatments & Medical Care</h2></div><p>Medical consultation, treatment and management based on the patient's needs and doctor's advice.</p></div><div class="grid3">${data.treatments.filter(x=>x.active).sort((a,b)=>(a.order||0)-(b.order||0)).map(t=>`<article class="card reveal">${t.photo?`<img src="${esc(t.photo)}" alt="${esc(t.name)}">`:`<div class="icon">${esc(t.icon||'🩺')}</div>`}<h3>${esc(t.name)}</h3><p>${esc(t.description)}</p><a class="btn soft small" href="#appointment">Book Consultation →</a></article>`).join('')}</div></div></section>
<section id="departments" class="section"><div class="container"><div class="head"><div><div class="kicker">Departments</div><h2>Departments</h2></div><p>Departments and their assigned doctors can be managed from the Admin Panel.</p></div><div class="grid3">${data.departments.filter(x=>x.active).map(d=>`<article class="card">${d.photo?`<img src="${esc(d.photo)}" alt="${esc(d.name)}">`:`<div class="icon">🏥</div>`}<h3>${esc(d.name)}</h3><p>${esc(d.description)}</p><a class="btn soft small" href="#appointment">Book Appointment →</a></article>`).join('')||'<div class="card"><h3>Department information</h3><p>Department information will be updated by the hospital administrator.</p></div>'}</div></div></section>
<section id="diabetes" class="section diabetes"><div class="container"><div class="head"><div><div class="kicker" style="color:#9ee0d4">Diabetes Care</div><h2>Control Diabetes With M.E.D.</h2></div><p>Based on the diabetes-awareness material supplied for the hospital. This section is for general awareness, not a personalized prescription.</p></div><div class="med-grid"><div class="med"><h3>M — Medication</h3><p>Take medicines as prescribed and follow your doctor's advice.</p></div><div class="med"><h3>E — Exercise</h3><ul><li>Yoga</li><li>Walking</li><li>Stairs</li><li>Cycling</li><li>Aerobics</li><li>Avoid prolonged sitting</li></ul></div><div class="med"><h3>D — Diet</h3><ul><li>Blueberries</li><li>Beans</li><li>Leafy greens</li><li>Fresh fruits</li><li>Low-fat yogurt</li><li>Nuts & seeds</li></ul></div></div></div></section>
<section id="gallery" class="section alt"><div class="container"><div class="head"><div><div class="kicker">Visuals</div><h2>Hospital Gallery</h2></div><p>Photos and videos added by the hospital administrator appear here.</p></div><div class="media-grid">${data.gallery.filter(x=>x.active!==false).map(g=>`<div class="media" onclick="openGallery('${g.id}')">${mediaTag(g)}<span class="badge">${g.type==='video'?'VIDEO':'PHOTO'}</span></div>`).join('')||'<div class="card"><h3>Gallery will be updated soon.</h3><p>No media has been published yet.</p></div>'}</div></div></section>
<section id="articles" class="section"><div class="container"><div class="head"><div><div class="kicker">Awareness</div><h2>Health Articles</h2></div><p>Health awareness articles published by the hospital administrator.</p></div><div class="grid3">${data.articles.filter(x=>x.active!==false).map(a=>`<article class="card">${a.photo?`<img src="${esc(a.photo)}" alt="${esc(a.title)}">`:''}<span class="tag">${esc(a.category||'Health Awareness')}</span><h3>${esc(a.title)}</h3><p>${esc(a.content).slice(0,180)}${a.content.length>180?'…':''}</p><button class="btn soft small" onclick="openArticle('${a.id}')">Read Article →</button></article>`).join('')||'<div class="card"><h3>No articles published yet.</h3></div>'}</div></div></section>
<section id="appointment" class="section alt"><div class="container"><div class="head"><div><div class="kicker">Appointments</div><h2>Book an Appointment</h2></div><p>Select a doctor and date. Available slots are controlled by the hospital administrator. One slot can be booked by only one patient.</p></div><div class="card"><form onsubmit="submitAppointment(event)"><div class="form-grid"><div class="field"><label>Patient Name *</label><input name="name" required></div><div class="field"><label>Phone *</label><input name="phone" required pattern="[0-9+() -]{7,20}"></div><div class="field"><label>Email</label><input type="email" name="email"></div><div class="field"><label>Age</label><input type="number" name="age" min="0" max="120"></div><div class="field"><label>Gender</label><select name="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field"><label>Doctor *</label><select id="apDoctor" name="doctor" required onchange="refreshAppointmentSlots()"><option value="">Select Doctor</option>${data.doctors.filter(d=>d.active).map(d=>`<option value="${esc(d.id)}">${esc(d.name)} — ${esc(d.type)}</option>`).join('')}</select></div><div class="field"><label>Department</label><select id="apDepartment" name="department"><option value="">Select Department</option>${data.departments.filter(d=>d.active).map(d=>`<option value="${esc(d.name)}">${esc(d.name)}</option>`).join('')}</select></div><div class="field"><label>Preferred Date *</label><input id="apDate" type="date" name="date" min="${today()}" required onchange="refreshAppointmentSlots()"></div><div class="field"><label>Available Slot *</label><select id="apTime" name="time" required><option value="">Select doctor and date first</option></select></div><div class="field"><label>Reason for Visit</label><input name="reason"></div><div class="field full"><label>Message</label><textarea name="message" rows="4"></textarea></div></div><div id="slotNotice" class="notice" style="margin-top:14px">Choose a doctor and date to see available slots.</div><div class="actions"><button class="btn primary" type="submit">Submit Appointment</button><a class="btn soft" href="#myappointment">My Appointment / Letter</a></div></form></div></div></section>
<section id="myappointment" class="section"><div class="container"><div class="head"><div><div class="kicker">Patient Panel</div><h2>My Appointment</h2></div><p>Enter your appointment ID and phone number to view the appointment letter and current status on this browser.</p></div><div class="card"><form onsubmit="lookupAppointment(event)"><div class="form-grid"><div class="field"><label>Appointment ID</label><input id="lookupId" required placeholder="VH-..."></div><div class="field"><label>Phone</label><input id="lookupPhone" required></div></div><button class="btn primary" style="margin-top:14px">View Appointment Letter</button></form><div id="lookupResult" style="margin-top:18px"></div></div></div></section>
<section id="contact" class="section alt"><div class="container"><div class="head"><div><div class="kicker">Contact</div><h2>Visit Vishwas Hospital</h2></div><p>${esc(data.settings.hours||'Hospital timings can be updated by the administrator.')}</p></div><div class="contact-grid"><div class="card contact-card"><div class="contact-row"><b>Address</b><small>${esc(data.settings.address||'Address will be updated by the administrator.')}</small></div><div class="contact-row"><b>Phone</b><small>${esc(data.settings.phone1)}${data.settings.phone2?' · '+esc(data.settings.phone2):''}</small></div><div class="contact-row"><b>WhatsApp</b><small>${esc(data.settings.whatsapp||'Not configured')}</small></div>${data.settings.email?`<div class="contact-row"><b>Email</b><small>${esc(data.settings.email)}</small></div>`:''}<div class="actions"><a class="btn soft" href="${waLink(data.settings.whatsapp,'Hello Vishwas Hospital, I would like to book an appointment.')}" target="_blank" rel="noopener">WhatsApp</a>${data.settings.maps?`<a class="btn primary" href="${esc(data.settings.maps)}" target="_blank" rel="noopener">Open Google Maps</a>`:''}</div></div><div class="mapbox">${mapEmbed()?`<iframe loading="lazy" src="${esc(mapEmbed())}" title="Vishwas Hospital location"></iframe>`:`<div style="padding:30px;text-align:center;color:var(--muted)"><h3>Google Maps</h3><p>Admin can add the Google Maps URL or hospital address from Website Settings.</p></div>`}</div></div></div></section>
<footer class="footer"><div class="container"><div class="footer-grid"><div><h3>${esc(data.settings.name)}</h3><p>${esc(data.settings.tagline)}</p><p>${esc(data.settings.subtag)}</p><div class="socials">${data.settings.instagram?`<a class="social" href="${esc(data.settings.instagram)}" target="_blank" rel="noopener">IG</a>`:''}${data.settings.facebook?`<a class="social" href="${esc(data.settings.facebook)}" target="_blank" rel="noopener">f</a>`:''}${data.settings.youtube?`<a class="social" href="${esc(data.settings.youtube)}" target="_blank" rel="noopener">▶</a>`:''}</div></div><div><h4>Explore</h4><a href="#about">About</a><a href="#doctors">Doctors</a><a href="#diseases">Diseases</a><a href="#treatments">Treatments</a><a href="#gallery">Gallery</a></div><div><h4>Appointments</h4><a href="#appointment">Book Appointment</a><a href="#myappointment">My Appointment</a><a href="#contact">Contact</a><a href="${waLink(data.settings.whatsapp,'Hello Vishwas Hospital, I would like to book an appointment.')}" target="_blank" rel="noopener">WhatsApp</a></div><div><h4>Hospital</h4><a href="#departments">Departments</a><a href="#diabetes">Diabetes Care</a><a href="#articles">Health Articles</a><a href="#contact">Location</a></div></div><div class="footer-bottom"><span>© ${new Date().getFullYear()} ${esc(data.settings.name)}. All rights reserved.</span><a class="admin-link" href="#admin" onclick="showLogin()">Admin Panel</a></div></div></footer><div class="floating"><a class="float-wa" href="${waLink(data.settings.whatsapp,'Hello Vishwas Hospital, I would like to book an appointment. Please provide available timings.')}" target="_blank" rel="noopener" aria-label="WhatsApp">◔</a></div>`;renderDoctorGrid();observe();}
function renderDoctorGrid(){const q=(document.getElementById('doctorSearch')?.value||'').toLowerCase();const f=document.getElementById('doctorFilter')?.value||'';let arr=data.doctors.filter(d=>d.active&&(!f||d.type===f)&&(!q||(d.name+' '+d.type+' '+(d.qualifications||[]).join(' ')+' '+(d.specializations||[]).join(' ')).toLowerCase().includes(q))).sort((a,b)=>(a.order||0)-(b.order||0));const el=document.getElementById('doctorGrid');if(!el)return;const primary=arr.find(d=>d.type==='PRIMARY DOCTOR');let html='';if(primary){html+=`<div class="doctor-main glass" style="margin-bottom:20px"><div class="doctor-photo"><img src="${esc(primary.photo||'assets/hospital-1.jpeg')}" alt="${esc(primary.name)}"></div><div class="doctor-info"><span class="tag">${esc(primary.type)}</span><h2>${esc(primary.name)}</h2><h3>${esc(primary.title||'')}</h3><div class="chips">${(primary.qualifications||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}${(primary.specializations||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}${primary.experience?`<span class="chip">${esc(primary.experience)} Experience</span>`:''}</div><p>${esc(primary.bio||'Profile details can be updated by the hospital administrator.')}</p><div class="actions"><button class="btn primary" onclick="openDoctor('${primary.id}')">View Full Profile</button><a class="btn soft" href="#appointment" onclick="prefillDoctor('${primary.id}')">Book Appointment</a></div></div></div>`}const others=arr.filter(d=>!primary||d.id!==primary.id);if(others.length)html+=`<div class="doctor-grid">${others.map(d=>`<article class="card doctor-card"><img src="${esc(d.photo||'assets/hospital-1.jpeg')}" alt="${esc(d.name)}"><div class="doctor-body"><div class="doctor-type">${esc(d.type)}</div><h3>${esc(d.name)}</h3><p><b>${esc((d.qualifications||[]).join(' • '))}</b></p><p>${esc((d.specializations||[]).join(' • '))}${d.experience?' · '+esc(d.experience)+' experience':''}</p><div class="actions"><button class="btn primary small" onclick="openDoctor('${d.id}')">View Profile</button><a class="btn soft small" href="#appointment" onclick="prefillDoctor('${d.id}')">Book</a></div></div></article>`).join('')}</div>`;el.innerHTML=html||'<div class="card"><h3>No matching doctor profiles.</h3><p>Try another search or ask the administrator to add a doctor.</p></div>'}
function prefillDoctor(id){setTimeout(()=>{const s=document.getElementById('apDoctor');if(s){s.value=id;refreshAppointmentSlots()}},80)}
function openDoctor(id){const d=data.doctors.find(x=>x.id===id);if(!d)return;openModal(`<span class="tag">${esc(d.type)}</span><h2>${esc(d.name)}</h2><div class="doctor-main" style="margin-top:18px"><div class="doctor-photo" style="min-height:300px"><img src="${esc(d.photo||'assets/hospital-1.jpeg')}" alt="${esc(d.name)}"></div><div class="doctor-info"><h3>${esc(d.title||'')}</h3><p><b>Qualifications:</b> ${esc((d.qualifications||[]).join(', ')||'Not provided')}</p><p><b>Specialization:</b> ${esc((d.specializations||[]).join(', ')||'Not provided')}</p><p><b>Experience:</b> ${esc(d.experience||'Not provided')}</p><p><b>Department:</b> ${esc(d.department||'Not provided')}</p><p><b>Languages:</b> ${esc((d.languages||[]).join(', ')||'Not provided')}</p><p><b>Consultation:</b> ${esc(d.days||'')} ${esc(d.time||'')}</p><p>${esc(d.bio||'Profile details will be updated by the administrator.')}</p><p><b>Areas of Expertise:</b> ${esc((d.expertise||[]).join(', ')||'Not provided')}</p><div class="actions"><button class="btn primary" onclick="closeModal();location.hash='appointment';prefillDoctor('${d.id}')">Book Appointment</button></div></div></div>`)}
function refreshAppointmentSlots(){const doc=document.getElementById('apDoctor')?.value,date=document.getElementById('apDate')?.value,sel=document.getElementById('apTime'),notice=document.getElementById('slotNotice');if(!sel)return;sel.innerHTML='<option value="">Select available slot</option>';if(!doc||!date){notice.textContent='Choose a doctor and date to see available slots.';return}if(date<today()){notice.className='notice error';notice.textContent='Please choose today or a future date.';return}const slots=(data.slots[doc]&&data.slots[doc][date])||[];const booked=data.appointments.filter(a=>a.doctor===doc&&a.date===date&&a.status!=='Cancelled').map(a=>a.time);const open=slots.filter(s=>!booked.includes(s));open.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s+' — Available';sel.appendChild(o)});notice.className=open.length?'notice success':'notice error';notice.textContent=open.length?`${open.length} slot(s) available for this doctor on ${date}. Each slot accepts one patient.`:'No available slots for this doctor on this date. Please choose another date.'}
function submitAppointment(e){e.preventDefault();const f=new FormData(e.target),doc=f.get('doctor'),date=f.get('date'),time=f.get('time');const slots=(data.slots[doc]&&data.slots[doc][date])||[];if(!slots.includes(time))return toast('That slot is not available. Please choose another slot.');if(data.appointments.some(a=>a.doctor===doc&&a.date===date&&a.time===time&&a.status!=='Cancelled'))return toast('This slot has already been booked. Please choose another slot.');const d=data.doctors.find(x=>x.id===doc);const ap={id:'VH-'+Date.now().toString(36).toUpperCase(),name:f.get('name'),phone:f.get('phone'),email:f.get('email'),age:f.get('age'),gender:f.get('gender'),doctor:doc,doctorName:d?.name||'',department:f.get('department'),date,time,reason:f.get('reason'),message:f.get('message'),status:'Pending',created:new Date().toISOString()};data.appointments.unshift(ap);save();e.target.reset();refreshAppointmentSlots();toast('Appointment booked: '+ap.id);showAppointmentLetter(ap.id)}
function showAppointmentLetter(id){const a=data.appointments.find(x=>x.id===id);if(!a)return;const d=data.doctors.find(x=>x.id===a.doctor);openModal(`<div class="letter" id="letter-${esc(a.id)}"><div class="letter-head"><div><b>${esc(data.settings.name)}</b><div style="font-size:11px;color:var(--muted)">${esc(data.settings.tagline)}</div></div><b>APPOINTMENT LETTER</b></div><div class="notice ${a.status==='Confirmed'?'success':''}" style="margin-top:18px">Status: <b>${esc(a.status)}</b> — Keep this Appointment ID: <b>${esc(a.id)}</b></div><table class="letter-table"><tr><td>Patient</td><td>${esc(a.name)}</td></tr><tr><td>Phone</td><td>${esc(a.phone)}</td></tr><tr><td>Doctor</td><td>${esc(d?.name||a.doctorName)}</td></tr><tr><td>Doctor Type</td><td>${esc(d?.type||'')}</td></tr><tr><td>Department</td><td>${esc(a.department||'')}</td></tr><tr><td>Date</td><td>${esc(a.date)}</td></tr><tr><td>Time Slot</td><td>${esc(a.time)}</td></tr><tr><td>Reason</td><td>${esc(a.reason||'')}</td></tr></table><p style="font-size:11px;color:var(--muted);margin-top:20px">Please carry your appointment ID and arrive according to the hospital's instructions. This letter is generated from the website appointment system.</p></div><div class="letter-actions"><button class="btn soft" onclick="printLetter('${esc(a.id)}')">Print / Save PDF</button><button class="btn primary" onclick="closeModal()">Close</button></div>`)}
function printLetter(id){const a=data.appointments.find(x=>x.id===id);if(!a)return;const d=data.doctors.find(x=>x.id===a.doctor);document.getElementById('printArea').innerHTML=`<div class="letter"><div class="letter-head"><div><b>${esc(data.settings.name)}</b><div>${esc(data.settings.tagline)}</div></div><b>APPOINTMENT LETTER</b></div><p><b>Status:</b> ${esc(a.status)} &nbsp; <b>Appointment ID:</b> ${esc(a.id)}</p><table class="letter-table"><tr><td>Patient</td><td>${esc(a.name)}</td></tr><tr><td>Phone</td><td>${esc(a.phone)}</td></tr><tr><td>Doctor</td><td>${esc(d?.name||a.doctorName)}</td></tr><tr><td>Department</td><td>${esc(a.department||'')}</td></tr><tr><td>Date</td><td>${esc(a.date)}</td></tr><tr><td>Time Slot</td><td>${esc(a.time)}</td></tr></table><p style="margin-top:20px">${esc(data.settings.name)} · ${esc(data.settings.address)}</p></div>`;window.print()}
function lookupAppointment(e){e.preventDefault();const id=document.getElementById('lookupId').value.trim(),phone=document.getElementById('lookupPhone').value.replace(/\D/g,'');const a=data.appointments.find(x=>x.id===id&&x.phone.replace(/\D/g,'')===phone);const r=document.getElementById('lookupResult');if(!a){r.innerHTML='<div class="notice error">Appointment not found. Check the Appointment ID and phone number.</div>';return}r.innerHTML=`<div class="notice success">Appointment found. Current status: <b>${esc(a.status)}</b></div><div class="actions"><button class="btn primary" onclick="showAppointmentLetter('${esc(a.id)}')">Open Appointment Letter</button></div>`}
function openGallery(id){const g=data.gallery.find(x=>x.id===id);if(!g)return;openModal(`${mediaTag(g,'preview')}<h3>${esc(g.title||'Hospital Gallery')}</h3><p style="color:var(--muted)">${esc(g.caption||'')}</p>`)}
function openArticle(id){const a=data.articles.find(x=>x.id===id);if(!a)return;openModal(`${a.photo?`<img class="preview" src="${esc(a.photo)}" alt="${esc(a.title)}">`:''}<span class="tag">${esc(a.category||'Health Awareness')}</span><h2>${esc(a.title)}</h2><p style="white-space:pre-wrap;line-height:1.8;color:var(--muted)">${esc(a.content)}</p>`)}
function showLogin(){openModal(`<h2>Admin Login</h2><p style="color:var(--muted)">Secure hospital management area.</p><form onsubmit="login(event)"><div class="field"><label>Email</label><input id="loginEmail" type="email" value="admin@gmail.com" required></div><div class="field" style="margin-top:10px"><label>Password</label><input id="loginPass" type="password" required></div><button class="btn primary" style="width:100%;margin-top:14px">Login</button></form><div class="notice" style="margin-top:12px">Initial login: admin@gmail.com / admin@123. Change these credentials before production use.</div>`)}
function login(e){e.preventDefault();if(document.getElementById('loginEmail').value==='admin@gmail.com'&&document.getElementById('loginPass').value==='admin@123'){sessionStorage.setItem('vhAdmin','1');closeModal();location.hash='admin';renderAdmin()}else toast('Invalid admin credentials')}
function logout(){sessionStorage.removeItem('vhAdmin');location.hash='home';renderPublic();toast('Logged out')}
function renderAdmin(){if(sessionStorage.getItem('vhAdmin')!=='1')return showLogin();document.body.className='admin';document.getElementById('app').innerHTML=`<div class="admin-shell"><aside class="side"><div class="side-brand">${esc(data.settings.name)}<small>Admin Control Center</small></div><button class="active" data-tab="dashboard">📊 Dashboard</button><button data-tab="appointments">📅 Appointments</button><button data-tab="slots">⏱ Slot Management</button><button data-tab="doctors">👨‍⚕️ Doctors</button><button data-tab="diseases">🩺 Diseases</button><button data-tab="treatments">💊 Treatments</button><button data-tab="departments">🏥 Departments</button><button data-tab="hero">🎬 Hero Media</button><button data-tab="gallery">🖼 Gallery</button><button data-tab="articles">📰 Articles</button><button data-tab="settings">⚙ Website Settings</button><button onclick="location.hash='home';renderPublic()">🌐 View Website</button><button onclick="logout()">↪ Logout</button></aside><main class="admin-main"><div class="admin-top"><div><div class="kicker">Hospital CMS</div><h1 style="margin:4px 0">Admin Dashboard</h1></div><button class="btn primary" onclick="location.hash='home';renderPublic()">View Public Site</button></div><div id="adminContent"></div></main></div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');adminTab(b.dataset.tab)});adminTab('dashboard')}
function adminTab(tab){const c=document.getElementById('adminContent');if(!c)return;if(tab==='dashboard')dashboardAdmin(c);else if(tab==='appointments')appointmentsAdmin(c);else if(tab==='slots')slotsAdmin(c);else if(tab==='doctors')doctorsAdmin(c);else if(tab==='diseases')contentAdmin(c,'diseases','Disease / Condition');else if(tab==='treatments')contentAdmin(c,'treatments','Treatment');else if(tab==='departments')contentAdmin(c,'departments','Department');else if(tab==='hero')heroAdmin(c);else if(tab==='gallery')galleryAdmin(c);else if(tab==='articles')articlesAdmin(c);else if(tab==='settings')settingsAdmin(c)}
function dashboardAdmin(c){c.innerHTML=`<div class="stat-grid">${[['Doctors',data.doctors.length],['Supportive',data.doctors.filter(x=>x.type==='SUPPORTIVE DOCTOR').length],['Appointments',data.appointments.length],['Pending',data.appointments.filter(x=>x.status==='Pending').length],['Treatments',data.treatments.length],['Diseases',data.diseases.length],['Gallery',data.gallery.length],['Articles',data.articles.length]].map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div><div class="admin-card"><h2>Quick Actions</h2><div class="actions"><button class="btn primary" onclick="adminTab('doctors')">Add Doctor</button><button class="btn soft" onclick="adminTab('slots')">Manage Slots</button><button class="btn soft" onclick="adminTab('hero')">Hero Media</button><button class="btn soft" onclick="adminTab('gallery')">Gallery</button><button class="btn soft" onclick="adminTab('settings')">Website Settings</button></div></div>`}
function appointmentsAdmin(c){const arr=[...data.appointments].sort((a,b)=>b.created.localeCompare(a.created));c.innerHTML=`<div class="admin-card"><div class="admin-top"><div><h2>Appointments</h2><p style="color:var(--muted)">Confirming an appointment locks its doctor/date/slot. Cancelling releases the slot.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Patient</th><th>Doctor</th><th>Date</th><th>Slot</th><th>Status</th><th>Actions</th></tr></thead><tbody>${arr.map(a=>{const d=data.doctors.find(x=>x.id===a.doctor);return `<tr><td><b>${esc(a.id)}</b></td><td>${esc(a.name)}<br>${esc(a.phone)}</td><td>${esc(d?.name||a.doctorName)}<br><span class="pill">${esc(d?.type||'')}</span></td><td>${esc(a.date)}</td><td>${esc(a.time)}</td><td><span class="pill ${a.status.toLowerCase()}">${esc(a.status)}</span></td><td><button class="btn small soft" onclick="viewAp('${a.id}')">View</button> ${a.status==='Pending'?`<button class="btn small primary" onclick="setApStatus('${a.id}','Confirmed')">Confirm & Letter</button>`:''} ${a.status!=='Cancelled'&&a.status!=='Completed'?`<button class="btn small danger" onclick="setApStatus('${a.id}','Cancelled')">Cancel</button>`:''} ${a.status==='Confirmed'?`<button class="btn small soft" onclick="showAppointmentLetter('${a.id}')">Letter</button>`:''} <button class="btn small danger" onclick="deleteAp('${a.id}')">Delete</button></td></tr>`}).join('')||'<tr><td colspan="7">No appointments found.</td></tr>'}</tbody></table></div></div>`}
function viewAp(id){const a=data.appointments.find(x=>x.id===id),d=data.doctors.find(x=>x.id===a.doctor);if(!a)return;openModal(`<h2>Appointment ${esc(a.id)}</h2><p><b>Patient:</b> ${esc(a.name)}</p><p><b>Phone:</b> ${esc(a.phone)}</p><p><b>Email:</b> ${esc(a.email||'')}</p><p><b>Doctor:</b> ${esc(d?.name||a.doctorName)}</p><p><b>Doctor Type:</b> ${esc(d?.type||'')}</p><p><b>Department:</b> ${esc(a.department||'')}</p><p><b>Date/Time:</b> ${esc(a.date)} ${esc(a.time)}</p><p><b>Reason:</b> ${esc(a.reason||'')}</p><p><b>Message:</b> ${esc(a.message||'')}</p><div class="actions"><button class="btn primary" onclick="closeModal();setApStatus('${a.id}','Confirmed')">Confirm Appointment</button><button class="btn soft" onclick="showAppointmentLetter('${a.id}')">Open Letter</button></div>`)}
function setApStatus(id,v){const a=data.appointments.find(x=>x.id===id);if(!a)return;if(v==='Confirmed'){const conflict=data.appointments.some(x=>x.id!==id&&x.doctor===a.doctor&&x.date===a.date&&x.time===a.time&&x.status!=='Cancelled');if(conflict){toast('Cannot confirm: slot is already occupied.');return}}a.status=v;save();closeModal();adminTab('appointments');toast('Appointment '+v+(v==='Confirmed'?' — letter issued.':''))}
function deleteAp(id){if(confirm('Delete appointment? This also removes the record; the slot becomes available.')){data.appointments=data.appointments.filter(a=>a.id!==id);save();adminTab('appointments');toast('Appointment deleted')}}
function slotsAdmin(c){const docs=data.doctors.filter(d=>d.active);c.innerHTML=`<div class="admin-card"><div class="admin-top"><div><h2>Slot Management</h2><p style="color:var(--muted)">Create date-specific slots for each doctor. One slot = one patient. Cancelled appointments release the slot.</p></div><button class="btn primary" onclick="slotForm()">+ Add Date Slots</button></div>${docs.map(d=>`<div class="admin-row"><img src="${esc(d.photo||'assets/hospital-1.jpeg')}"><div class="grow"><b>${esc(d.name)}</b><small>${esc(d.type)}</small></div><button class="btn small soft" onclick="slotForm('${d.id}')">Manage Slots</button></div>`).join('')||'<p>No active doctors.</p>'}</div>`}
function slotForm(docId){const docs=data.doctors.filter(d=>d.active);openModal(`<h2>Manage Doctor Slots</h2><form onsubmit="saveSlots(event)"><div class="field"><label>Doctor *</label><select id="slotDoctor" required onchange="showExistingSlots()">${docs.map(d=>`<option value="${esc(d.id)}" ${d.id===docId?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label>Date *</label><input id="slotDate" type="date" min="${today()}" value="${today()}" required onchange="showExistingSlots()"></div><div class="field" style="margin-top:10px"><label>Slots (comma separated)</label><input id="slotTimes" placeholder="09:00, 09:30, 10:00, 10:30" required></div><div id="existingSlots" class="notice" style="margin-top:10px"></div><button class="btn primary" style="margin-top:14px">Save Slots</button></form>`);setTimeout(showExistingSlots,30)}
function showExistingSlots(){const d=document.getElementById('slotDoctor')?.value,date=document.getElementById('slotDate')?.value,r=document.getElementById('existingSlots');if(!r)return;const s=(data.slots[d]&&data.slots[d][date])||[];r.textContent=s.length?'Existing slots: '+s.join(', '):'No slots created for this date yet.'}
function saveSlots(e){e.preventDefault();const d=document.getElementById('slotDoctor').value,date=document.getElementById('slotDate').value,times=document.getElementById('slotTimes').value.split(',').map(x=>x.trim()).filter(Boolean);if(!times.length)return;data.slots[d]=data.slots[d]||{};data.slots[d][date]=[...new Set(times)].sort();save();closeModal();adminTab('slots');toast('Date-specific slots saved')}
function doctorForm(id){const d=data.doctors.find(x=>x.id===id)||{id:uid('d'),type:'SUPPORTIVE DOCTOR',name:'',title:'',qualifications:[],specializations:[],experience:'',bio:'',expertise:[],languages:[],days:'',time:'',department:'',phone:'',whatsapp:'',email:'',registration:'',photo:'',active:true,order:data.doctors.length+1};openModal(`<h2>${id?'Edit':'Add'} Doctor</h2><form onsubmit="saveDoctor(event,'${esc(d.id)}',${!!id})"><div class="form-grid"><div class="field full"><label>Doctor Photo</label><input id="docPhoto" type="file" accept="image/*" onchange="previewFile(this,'docPreview')"><img id="docPreview" class="preview" src="${esc(d.photo||'assets/hospital-1.jpeg')}" alt="Preview"></div><div class="field"><label>Name *</label><input id="docName" value="${esc(d.name)}" required></div><div class="field"><label>Professional Title</label><input id="docTitle" value="${esc(d.title)}"></div><div class="field"><label>Doctor Type *</label><select id="docType">${['PRIMARY DOCTOR','SUPPORTIVE DOCTOR','VISITING DOCTOR','CONSULTANT','SPECIALIST','OTHER'].map(x=>`<option ${d.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Years of Experience</label><input id="docExp" value="${esc(d.experience)}" placeholder="e.g. 15"></div><div class="field full"><label>Qualifications / Degrees (comma separated)</label><input id="docQual" value="${esc((d.qualifications||[]).join(', '))}" placeholder="MBBS, MD, Fellowship"></div><div class="field full"><label>Specializations (comma separated)</label><input id="docSpec" value="${esc((d.specializations||[]).join(', '))}"></div><div class="field full"><label>Areas of Expertise (comma separated)</label><input id="docExpert" value="${esc((d.expertise||[]).join(', '))}"></div><div class="field"><label>Languages (comma separated)</label><input id="docLang" value="${esc((d.languages||[]).join(', '))}"></div><div class="field"><label>Department</label><input id="docDept" value="${esc(d.department)}"></div><div class="field"><label>Consultation Days</label><input id="docDays" value="${esc(d.days)}" placeholder="Mon, Wed, Fri"></div><div class="field"><label>Consultation Time</label><input id="docTime" value="${esc(d.time)}" placeholder="10:00 AM – 1:00 PM"></div><div class="field"><label>Phone</label><input id="docPhone" value="${esc(d.phone)}"></div><div class="field"><label>WhatsApp</label><input id="docWa" value="${esc(d.whatsapp)}"></div><div class="field"><label>Email</label><input id="docEmail" value="${esc(d.email)}"></div><div class="field"><label>Registration Number</label><input id="docReg" value="${esc(d.registration)}"></div><div class="field full"><label>About / Biography</label><textarea id="docBio" rows="5">${esc(d.bio)}</textarea></div><div class="field"><label>Display Order</label><input id="docOrder" type="number" value="${Number(d.order||1)}"></div><div class="field"><label>Profile Status</label><select id="docActive"><option value="1" ${d.active?'selected':''}>Active</option><option value="0" ${!d.active?'selected':''}>Inactive</option></select></div></div><button class="btn primary" style="margin-top:15px">Save Doctor</button></form>`)}
function previewFile(inp,target){const f=inp.files[0];if(f&&f.type.startsWith('image')){const r=new FileReader();r.onload=()=>document.getElementById(target).src=r.result;r.readAsDataURL(f)}}
function saveDoctor(e,id,edit){e.preventDefault();const old=data.doctors.find(x=>x.id===id),d=old||{id};const f=document.getElementById('docPhoto').files[0];const finish=photo=>{Object.assign(d,{name:docName.value,title:docTitle.value,type:docType.value,experience:docExp.value,qualifications:csv(docQual.value),specializations:csv(docSpec.value),expertise:csv(docExpert.value),languages:csv(docLang.value),department:docDept.value,days:docDays.value,time:docTime.value,phone:docPhone.value,whatsapp:docWa.value,email:docEmail.value,registration:docReg.value,bio:docBio.value,order:Number(docOrder.value||1),active:docActive.value==='1',photo:photo||d.photo||''});if(d.type==='PRIMARY DOCTOR')data.doctors.forEach(x=>{if(x.id!==d.id&&x.type==='PRIMARY DOCTOR')x.type='SUPPORTIVE DOCTOR'});if(!edit)data.doctors.push(d);save();closeModal();adminTab('doctors');toast('Doctor saved')};if(f){const r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(f)}else finish(d.photo)}
function csv(v){return v.split(',').map(x=>x.trim()).filter(Boolean)}
function doctorsAdmin(c){c.innerHTML=`<div class="admin-card"><div class="admin-top"><div><h2>Doctor Management</h2><p style="color:var(--muted)">Manage primary, supportive, visiting, consultant and specialist doctors.</p></div><button class="btn primary" onclick="doctorForm()">+ Add Doctor</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Photo</th><th>Doctor</th><th>Type</th><th>Degrees</th><th>Specialization</th><th>Experience</th><th>Status</th><th>Actions</th></tr></thead><tbody>${data.doctors.map(d=>`<tr><td><img class="thumb" src="${esc(d.photo||'assets/hospital-1.jpeg')}"></td><td><b>${esc(d.name)}</b><br><small>${esc(d.department||'')}</small></td><td>${esc(d.type)}</td><td>${esc((d.qualifications||[]).join(', '))}</td><td>${esc((d.specializations||[]).join(', '))}</td><td>${esc(d.experience||'')}</td><td>${d.active?'Active':'Inactive'}</td><td><button class="btn small soft" onclick="doctorForm('${d.id}')">Edit</button> <button class="btn small soft" onclick="toggleDoctor('${d.id}')">${d.active?'Disable':'Enable'}</button> <button class="btn small danger" onclick="deleteDoctor('${d.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`}
function toggleDoctor(id){const d=data.doctors.find(x=>x.id===id);if(d){d.active=!d.active;save();adminTab('doctors')}}function deleteDoctor(id){if(confirm('Delete doctor? Existing appointment records will keep their saved doctor name.')){data.doctors=data.doctors.filter(x=>x.id!==id);save();adminTab('doctors')}}
function contentAdmin(c,key,label){const arr=data[key];c.innerHTML=`<div class="admin-card"><div class="admin-top"><div><h2>${label}s</h2><p style="color:var(--muted)">Add, edit, delete and upload photos. Public content updates immediately.</p></div><button class="btn primary" onclick="genericForm('${key}')">+ Add ${label}</button></div><div class="admin-list">${arr.map(x=>`<div class="admin-row">${x.photo?`<img src="${esc(x.photo)}">`:`<div class="thumb"></div>`}<div class="grow"><b>${esc(x.name)}</b><small>${esc(x.description||'')}</small></div><label class="switch"><input type="checkbox" ${x.active?'checked':''} onchange="toggleContent('${key}','${x.id}')"> Active</label><button class="btn small soft" onclick="genericForm('${key}','${x.id}')">Edit</button><button class="btn small danger" onclick="deleteContent('${key}','${x.id}')">Delete</button></div>`).join('')||`<div class="notice">No ${label.toLowerCase()} entries yet.</div>`}</div></div>`}
function genericForm(key,id){const arr=data[key],isDept=key==='departments',old=arr.find(x=>x.id===id),x=old||{id:uid(key.slice(0,2)),name:'',description:'',photo:'',icon:'🩺',active:true,order:arr.length+1};openModal(`<h2>${id?'Edit':'Add'} ${key==='diseases'?'Disease / Condition':key==='treatments'?'Treatment':'Department'}</h2><form onsubmit="saveGeneric(event,'${key}','${x.id}',${!!id})"><div class="form-grid"><div class="field full"><label>Photo</label><input id="gPhoto" type="file" accept="image/*" onchange="previewFile(this,'gPreview')"><img id="gPreview" class="preview" src="${esc(x.photo||'')}" style="${x.photo?'':'display:none'}"></div><div class="field"><label>Name *</label><input id="gName" value="${esc(x.name)}" required></div>${key==='treatments'?`<div class="field"><label>Icon</label><input id="gIcon" value="${esc(x.icon||'🩺')}"></div>`:''}<div class="field"><label>Display Order</label><input id="gOrder" type="number" value="${Number(x.order||1)}"></div><div class="field full"><label>Description</label><textarea id="gDesc" rows="5">${esc(x.description||'')}</textarea></div>${isDept?`<div class="field full"><label>Assigned Doctor IDs (comma separated, optional)</label><input id="gDoctors" value="${esc((x.doctors||[]).join(', '))}"></div>`:''}</div><button class="btn primary" style="margin-top:14px">Save</button></form>`)}
function saveGeneric(e,key,id,edit){e.preventDefault();const arr=data[key],x=arr.find(v=>v.id===id)||{id};const f=document.getElementById('gPhoto').files[0];const finish=photo=>{x.name=gName.value;x.description=gDesc.value;x.order=Number(gOrder.value||1);x.active=x.active!==false;x.photo=photo||x.photo||'';if(key==='treatments')x.icon=gIcon.value||'🩺';if(key==='departments')x.doctors=csv(document.getElementById('gDoctors').value);if(!edit)arr.push(x);save();closeModal();adminTab(key);toast('Saved')};if(f){const r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(f)}else finish(x.photo)}
function toggleContent(key,id){const x=data[key].find(v=>v.id===id);if(x){x.active=!x.active;save()}}function deleteContent(key,id){if(confirm('Delete this item?')){data[key]=data[key].filter(x=>x.id!==id);save();adminTab(key)}}
function heroAdmin(c){c.innerHTML=`<div class="admin-card"><div class="admin-top"><div><h2>Hero Media</h2><p style="color:var(--muted)">Upload hospital photos or videos. The active media appears in the Hero section.</p></div><button class="btn primary" onclick="heroForm()">+ Add Hero Media</button></div><div class="admin-list">${data.hero.map(h=>`<div class="admin-row">${h.type==='video'?`<video class="thumb" src="${esc(h.src)}" muted></video>`:`<img class="thumb" src="${esc(h.src)}">`}<div class="grow"><b>${esc(h.title||'Hero Media')}</b><small>${esc(h.type)} · ${h.active?'Active':'Inactive'}</small></div><button class="btn small soft" onclick="setHero('${h.id}')">Set Active</button><button class="btn small danger" onclick="deleteHero('${h.id}')">Delete</button></div>`).join('')}</div></div>`}
function heroForm(){openModal(`<h2>Add Hero Photo / Video</h2><form onsubmit="saveHero(event)"><div class="form-grid"><div class="field"><label>Media Type</label><select id="hType"><option value="image">Photo</option><option value="video">Video</option></select></div><div class="field"><label>Title</label><input id="hTitle"></div><div class="field full"><label>Upload File</label><input id="hFile" type="file" accept="image/*,video/mp4,video/webm,video/ogg" required></div></div><div class="notice" style="margin-top:10px">For local HTML, keep videos reasonably small. For a live site, use cloud storage such as Firebase/Supabase Storage.</div><button class="btn primary" style="margin-top:14px">Add Media</button></form>`)}
function saveHero(e){e.preventDefault();const f=document.getElementById('hFile').files[0],type=document.getElementById('hType').value;if(!f)return;const r=new FileReader();r.onload=()=>{data.hero.forEach(x=>x.active=false);data.hero.push({id:uid('h'),type,src:r.result,title:document.getElementById('hTitle').value,active:true,order:data.hero.length+1});save();closeModal();adminTab('hero');toast('Hero media added')};r.readAsDataURL(f)}function setHero(id){data.hero.forEach(x=>x.active=x.id===id);save();adminTab('hero');toast('Hero media activated')}function deleteHero(id){if(data.hero.length<=1)return toast('Keep at least one hero media');data.hero=data.hero.filter(x=>x.id!==id);if(!data.hero.some(x=>x.active))data.hero[0].active=true;save();adminTab('hero')}
function galleryAdmin(c){c.innerHTML=`<div class="admin-card"><div class="admin-top"><div><h2>Gallery</h2><p style="color:var(--muted)">Upload photos and videos with title, category and caption.</p></div><button class="btn primary" onclick="galleryForm()">+ Add Photo / Video</button></div><div class="admin-list">${data.gallery.map(g=>`<div class="admin-row">${g.type==='video'?`<video class="thumb" src="${esc(g.src)}" muted></video>`:`<img class="thumb" src="${esc(g.src)}">`}<div class="grow"><b>${esc(g.title||'Untitled')}</b><small>${esc(g.category||'Other')} · ${g.type}</small></div><button class="btn small soft" onclick="galleryForm('${g.id}')">Edit</button><button class="btn small danger" onclick="deleteGallery('${g.id}')">Delete</button></div>`).join('')||'<div class="notice">No gallery media added yet.</div>'}</div></div>`}
function galleryForm(id){const g=data.gallery.find(x=>x.id===id)||{id:uid('g'),type:'image',src:'',title:'',category:'Hospital',caption:'',active:true};openModal(`<h2>${id?'Edit':'Add'} Gallery Media</h2><form onsubmit="saveGallery(event,'${g.id}',${!!id})"><div class="form-grid"><div class="field"><label>Type</label><select id="galType"><option value="image" ${g.type==='image'?'selected':''}>Photo</option><option value="video" ${g.type==='video'?'selected':''}>Video</option></select></div><div class="field"><label>Category</label><select id="galCat">${['Hospital','Doctors','Departments','Facilities','Events','Health Awareness','Other'].map(x=>`<option ${g.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>Upload / Replace File</label><input id="galFile" type="file" accept="image/*,video/mp4,video/webm,video/ogg"><small style="color:var(--muted)">${g.src?'Leave empty to keep current media.':''}</small></div><div class="field"><label>Title</label><input id="galTitle" value="${esc(g.title)}"></div><div class="field"><label>Active</label><select id="galActive"><option value="1" ${g.active?'selected':''}>Active</option><option value="0" ${!g.active?'selected':''}>Hidden</option></select></div><div class="field full"><label>Caption</label><textarea id="galCaption" rows="4">${esc(g.caption)}</textarea></div></div><button class="btn primary" style="margin-top:14px">Save Gallery Media</button></form>`)}
function saveGallery(e,id,edit){e.preventDefault();const g=data.gallery.find(x=>x.id===id)||{id};const f=document.getElementById('galFile').files[0];const finish=src=>{Object.assign(g,{type:document.getElementById('galType').value,category:document.getElementById('galCat').value,title:document.getElementById('galTitle').value,caption:document.getElementById('galCaption').value,active:document.getElementById('galActive').value==='1',src:src||g.src});if(!g.src)return toast('Please upload a file');if(!edit)data.gallery.push(g);save();closeModal();adminTab('gallery');toast('Gallery saved')};if(f){const r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(f)}else finish(g.src)}function deleteGallery(id){if(confirm('Delete gallery media?')){data.gallery=data.gallery.filter(x=>x.id!==id);save();adminTab('gallery')}}
function articlesAdmin(c){c.innerHTML=`<div class="admin-card"><div class="admin-top"><div><h2>Health Articles</h2><p style="color:var(--muted)">Add an article photo, category, content and publish status.</p></div><button class="btn primary" onclick="articleForm()">+ Add Article</button></div><div class="admin-list">${data.articles.map(a=>`<div class="admin-row">${a.photo?`<img class="thumb" src="${esc(a.photo)}">`:`<div class="thumb"></div>`}<div class="grow"><b>${esc(a.title)}</b><small>${esc(a.category||'Health Awareness')}</small></div><button class="btn small soft" onclick="articleForm('${a.id}')">Edit</button><button class="btn small danger" onclick="deleteArticle('${a.id}')">Delete</button></div>`).join('')||'<div class="notice">No articles published yet.</div>'}</div></div>`}
function articleForm(id){const a=data.articles.find(x=>x.id===id)||{id:uid('a'),title:'',category:'Health Awareness',content:'',photo:'',active:true};openModal(`<h2>${id?'Edit':'Add'} Health Article</h2><form onsubmit="saveArticle(event,'${a.id}',${!!id})"><div class="form-grid"><div class="field full"><label>Article Photo</label><input id="aPhoto" type="file" accept="image/*"><img class="preview" id="aPreview" src="${esc(a.photo)}" style="${a.photo?'':'display:none'}"></div><div class="field"><label>Title *</label><input id="aTitle" value="${esc(a.title)}" required></div><div class="field"><label>Category</label><input id="aCat" value="${esc(a.category)}"></div><div class="field full"><label>Content</label><textarea id="aContent" rows="10">${esc(a.content)}</textarea></div><div class="field"><label>Status</label><select id="aActive"><option value="1" ${a.active?'selected':''}>Published</option><option value="0" ${!a.active?'selected':''}>Hidden</option></select></div></div><button class="btn primary" style="margin-top:14px">Save Article</button></form>`);document.getElementById('aPhoto')?.addEventListener('change',e=>previewFile(e.target,'aPreview'))}
function saveArticle(e,id,edit){e.preventDefault();const a=data.articles.find(x=>x.id===id)||{id};const f=document.getElementById('aPhoto').files[0];const finish=photo=>{Object.assign(a,{title:aTitle.value,category:aCat.value,content:aContent.value,active:aActive.value==='1',photo:photo||a.photo||''});if(!edit)data.articles.push(a);save();closeModal();adminTab('articles');toast('Article saved')};if(f){const r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(f)}else finish(a.photo)}function deleteArticle(id){if(confirm('Delete article?')){data.articles=data.articles.filter(x=>x.id!==id);save();adminTab('articles')}}
function settingsAdmin(c){c.innerHTML=`<div class="admin-card"><h2>Website Settings</h2><form onsubmit="saveSettings(event)"><div class="form-grid"><div class="field full"><label>Hospital Logo</label><input id="sLogoFile" type="file" accept="image/*"><img class="preview" id="sLogoPreview" src="${esc(data.settings.logo||'')}" style="${data.settings.logo?'':'display:none'}"></div><div class="field"><label>Hospital Name</label><input id="sName" value="${esc(data.settings.name)}"></div><div class="field"><label>Tagline</label><input id="sTag" value="${esc(data.settings.tagline)}"></div><div class="field"><label>Subtag</label><input id="sSub" value="${esc(data.settings.subtag)}"></div><div class="field"><label>Food Tagline</label><input id="sFood" value="${esc(data.settings.food)}"></div><div class="field"><label>Hero Heading</label><input id="sHeroTitle" value="${esc(data.settings.heroTitle)}"></div><div class="field full"><label>Hero Text</label><textarea id="sHeroText" rows="3">${esc(data.settings.heroText)}</textarea></div><div class="field full"><label>About Text</label><textarea id="sAbout" rows="4">${esc(data.settings.about)}</textarea></div><div class="field"><label>Phone 1</label><input id="sP1" value="${esc(data.settings.phone1)}"></div><div class="field"><label>Phone 2</label><input id="sP2" value="${esc(data.settings.phone2)}"></div><div class="field"><label>WhatsApp Number</label><input id="sWa" value="${esc(data.settings.whatsapp)}"></div><div class="field"><label>Email</label><input id="sEmail" value="${esc(data.settings.email)}"></div><div class="field full"><label>Address</label><textarea id="sAddr" rows="3">${esc(data.settings.address)}</textarea></div><div class="field full"><label>Google Maps URL</label><input id="sMaps" value="${esc(data.settings.maps)}" placeholder="Paste Google Maps share/embed URL"></div><div class="field"><label>Working Hours</label><input id="sHours" value="${esc(data.settings.hours)}"></div><div class="field"><label>Instagram Link</label><input id="sIg" value="${esc(data.settings.instagram)}"></div><div class="field"><label>Facebook Link</label><input id="sFb" value="${esc(data.settings.facebook)}"></div><div class="field"><label>YouTube Link</label><input id="sYt" value="${esc(data.settings.youtube)}"></div></div><button class="btn primary" style="margin-top:15px">Save Website Settings</button></form></div><div class="admin-card"><h2>Data Backup</h2><p style="color:var(--muted)">Export a JSON backup before major edits. Importing replaces the current local data.</p><div class="actions"><button class="btn soft" onclick="exportData()">Export JSON</button><label class="btn soft" style="cursor:pointer">Import JSON<input hidden type="file" accept="application/json" onchange="importData(event)"></label><button class="btn danger" onclick="resetData()">Reset Website Data</button></div></div>`;document.getElementById('sLogoFile')?.addEventListener('change',e=>previewFile(e.target,'sLogoPreview'))}
function saveSettings(e){e.preventDefault();const f=document.getElementById('sLogoFile').files[0];const finish=logo=>{Object.assign(data.settings,{name:sName.value,tagline:sTag.value,subtag:sSub.value,food:sFood.value,heroTitle:sHeroTitle.value,heroText:sHeroText.value,about:sAbout.value,phone1:sP1.value,phone2:sP2.value,whatsapp:sWa.value,email:sEmail.value,address:sAddr.value,maps:sMaps.value,hours:sHours.value,instagram:sIg.value,facebook:sFb.value,youtube:sYt.value,logo:logo||data.settings.logo});save();toast('Website settings saved');setTimeout(renderAdmin,300)};if(f){const r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(f)}else finish(data.settings.logo)}
function exportData(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vishwas-hospital-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();renderAdmin();toast('Backup imported')}catch(err){toast('Invalid JSON backup')}};r.readAsText(f)}function resetData(){if(confirm('Reset all local website data to the original hospital setup?')){localStorage.removeItem(KEY);data=load();renderAdmin();toast('Data reset')}}
function observe(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('show')}),{threshold:.1});document.querySelectorAll('.reveal').forEach(x=>io.observe(x))}
function route(){if(location.hash==='#admin'){if(sessionStorage.getItem('vhAdmin')==='1')renderAdmin();else{renderPublic();setTimeout(showLogin,100)}}else renderPublic()}
window.addEventListener('hashchange',route);window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});route();
</script>
</body></html>
